name: Fetch laws

on:
  schedule:
    - cron: "0 18 * * 6"   # 매주 일요일 03:00 (한국시간)
  workflow_dispatch:        # Actions 탭의 Run workflow 버튼

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 법령 본문 받기
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          PYTHONUNBUFFERED: "1"   # 진행 로그가 실시간으로 보이게(중간에 끊겨도 남게)
        run: python scripts/fetch_laws.py

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "laws: 법령 본문 갱신 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push origin main
